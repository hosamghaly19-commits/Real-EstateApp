name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: re_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/re_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/re_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      - name: Generate initial migration (first run only)
        id: mig
        run: |
          if [ -d prisma/migrations ]; then
            echo "migrations already exist"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DIR=prisma/migrations/20260101000000_init
          mkdir -p "$DIR"
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > "$DIR/migration.sql" 2> /tmp/diff.err || { cat /tmp/diff.err; exit 1; }
          head -n 1 "$DIR/migration.sql" | grep -q '^-- CreateEnum' || { echo "::error::unexpected migration output"; head -n 20 "$DIR/migration.sql"; cat /tmp/diff.err; exit 1; }
          grep -q 'CREATE TABLE "User"' "$DIR/migration.sql" || { echo "::error::migration has no User table"; exit 1; }
          { echo; echo "-- ===== constraints.sql (partial indexes / CHECK / pg_trgm) ====="; cat prisma/sql/constraints.sql; } >> "$DIR/migration.sql"
          printf '# Please do not edit this file manually\nprovider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "Generated $(wc -l < "$DIR/migration.sql") lines of SQL"

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Seed
        run: npx tsx prisma/seed.ts

      - run: npm run typecheck

      - name: Tests (25 integration tests)
        run: npm test

      - name: Commit the verified migration
        if: steps.mig.outputs.generated == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations
          git commit -m "chore(db): add initial Prisma migration (generated and verified by CI)"
          git push
